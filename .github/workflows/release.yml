name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: release
    # set the CARGO_REGISTRY_TOKEN secret to publish a brand new crate:
    # crates.io trusted publishing (OIDC) only works once a crate exists
    env:
      MANUAL_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: "release"
          workspaces: |
            crates -> target

      - name: Use manual crates.io token when set
        if: env.MANUAL_CRATES_TOKEN != ''
        run: echo "CARGO_REGISTRY_TOKEN=$MANUAL_CRATES_TOKEN" >> "$GITHUB_ENV"

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        with:
          manifest_path: crates/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
