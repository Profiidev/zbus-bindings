name: Upstream Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight UTC

jobs:
  update-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # -X ours keeps our [package] name and version when upstream's bumps
      # conflict; upstream code changes still apply
      - name: Pull upstream
        run: |
          git config user.name "profidev-commit-bot[bot]"
          git config user.email "profidev-commit-bot[bot]@users.noreply.github.com"
          git subtree pull --prefix=crates \
            https://github.com/pop-os/dbus-settings-bindings main \
            -X ours -m "chore: pull upstream"

      # an unmapped crate only warns; the PR still opens and the auto-merge
      # guard refuses to merge it
      - name: Re-apply crate names
        run: node scripts/rename-crates.js crates --write

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update upstream"
          branch: "chore/update-upstream-${{ github.run_id }}"
          title: "chore: update upstream"
          body: "This PR pulls the latest upstream changes into `crates/`."
          base: main
          sign-commits: true
          labels: upstream-update
