name: Upstream Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight UTC

jobs:
  update-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # `git subtree pull` takes no -X, so do what it does by hand: fetch, then
      # a subtree merge. Conflicts are committed as-is (markers and all) and
      # reported; the PR then carries a different label so auto-merge skips it.
      - name: Pull upstream
        id: merge
        run: |
          git config user.name "profidev-commit-bot[bot]"
          git config user.email "profidev-commit-bot[bot]@users.noreply.github.com"
          conflicts=""
          # "<repo> <prefix>" per subtree; the nested prefix has its own
          # entry, dbus-settings-bindings never touches crates/freedesktop-icons
          while read -r repo prefix; do
            git fetch "https://github.com/pop-os/$repo" main
            git merge --no-edit -X subtree="$prefix" FETCH_HEAD -m "chore: pull upstream $repo" || true

            # upstream's Cargo.toml wins so its dependency changes land; our
            # version (owned by release-plz) is put back here, our package name
            # by rename-crates.js in the next step
            for f in $(git diff --name-only --diff-filter=U -- 'crates/*/Cargo.toml'); do
              v=$(git show ":2:$f" | grep -m1 '^version *=') &&
                git checkout --theirs -- "$f" &&
                sed -i "0,/^version *=.*/s//$v/" "$f" &&
                git add -- "$f" || true
            done

            c=$(git diff --name-only --diff-filter=U)
            if [ -n "$c" ]; then
              echo "::warning::$repo conflicts: $(printf '%s' "$c" | tr '\n' ' ')"
              git add -A
              conflicts="$conflicts$c"$'\n'
            fi
            # a clean merge already committed itself; a conflicted one has not
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit --no-edit
            fi
          done <<'EOF'
          dbus-settings-bindings crates
          freedesktop-icons crates/freedesktop-icons
          EOF
          conflicts=${conflicts%$'\n'}

          # printf, not echo: echo on an empty list emits a newline, tr turns it
          # into " ", and a single space is truthy in a GitHub expression
          echo "conflicts=$(printf '%s' "$conflicts" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "note<<GHEOF"
            if [ -n "$conflicts" ]; then
              echo "Conflicts are committed as-is. A modify/delete conflict leaves no"
              echo "markers, only our version of the file."
              echo
              printf '%s\n' "$conflicts" | sed 's|^|- `|; s|$|`|'
              echo
              echo "Resolve them on this branch, then add the \`upstream-update\` label to auto-merge."
            fi
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # an unmapped crate only warns; the PR still opens and the auto-merge
      # guard refuses to merge it
      - name: Re-apply crate names
        run: node scripts/rename-crates.js crates --write

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update upstream"
          branch: "chore/update-upstream-${{ github.run_id }}"
          title: "chore: update upstream"
          body: |
            This PR pulls the latest upstream changes of dbus-settings-bindings and freedesktop-icons into `crates/`.

            ${{ steps.merge.outputs.note }}
          base: main
          # sign-commits replays each commit through the API with a single
          # parent, which flattens the subtree merge and re-applies upstream's
          # root-relative paths at the repo root; push the real commits instead
          sign-commits: false
          labels: ${{ steps.merge.outputs.conflicts && 'upstream-conflict' || 'upstream-update' }}
