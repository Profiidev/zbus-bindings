name: Auto Merge PR with Upstream Update

on:
  pull_request:
    types:
      - labeled

jobs:
  merge:
    permissions:
      id-token: write
      contents: read
    if: ${{ github.event.label.name == 'upstream-update' && github.event.pull_request.user.login == 'profidev-commit-bot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
          profile: pr-automation
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # scripts/rename-crates.js names unmapped crates corona-zbus-unmapped-*
      - name: Refuse unmapped crates
        run: |
          if grep -rln 'name = "corona-zbus-unmapped-' crates/*/Cargo.toml; then
            echo "::error::unmapped crate(s) above; add them to MAP in scripts/rename-crates.js"
            exit 1
          fi

      # --merge, not --squash: release-plz derives changelogs and bump levels
      # from upstream's individual conventional commits
      - name: Enable auto-merge for PR
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --merge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
