name: Auto Merge PR with Upstream Update

on:
  pull_request:
    types:
      - labeled

jobs:
  merge:
    if: ${{ github.event.label.name == 'upstream-update' && github.event.pull_request.user.login == 'profidev-commit-bot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # scripts/rename-crates.js names unmapped crates corona-zbus-unmapped-*
      - name: Refuse unmapped crates
        run: |
          if grep -rln 'name = "corona-zbus-unmapped-' crates/*/Cargo.toml; then
            echo "::error::unmapped crate(s) above; add them to MAP in scripts/rename-crates.js"
            exit 1
          fi

      - name: Enable auto-merge for PR
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
