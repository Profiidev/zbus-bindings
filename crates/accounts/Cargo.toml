[package]
name = "corona-zbus-accounts"
version = "0.2.0"
repository = "https://github.com/pop-os/dbus-settings-bindings"
description = "dbus bindings for org.freedesktop.Acccounts with zbus"
edition = "2024"
license = "MPL-2.0"

[lib]
name = "accounts_zbus"

[dependencies]
zbus.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
