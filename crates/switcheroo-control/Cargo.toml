[package]
name = "corona-zbus-switcheroo-control"
version = "0.1.0"
repository = "https://github.com/pop-os/dbus-settings-bindings"
description = "dbus bindings for net.hadess.SwitcherooControl with zbus"
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "switcheroo_control"

[dependencies]
zbus.workspace = true

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
zbus.workspace = true
zbus.features = ["tokio"]
