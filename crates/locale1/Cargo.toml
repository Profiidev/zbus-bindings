[package]
name = "corona-zbus-locale1"
version = "0.1.0"
repository = "https://github.com/pop-os/dbus-settings-bindings"
description = "dbus bindings for org.freedesktop.locale1 with zbus"
license = "MPL-2.0"
edition = "2024"

[lib]
name = "locale1"

[dependencies]
zbus.workspace = true

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
zbus.workspace = true
zbus.features = ["tokio"]
