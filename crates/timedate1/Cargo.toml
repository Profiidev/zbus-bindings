[package]
name = "corona-zbus-unmapped-timedate1"
version = "0.1.0"
description = "dbus bindings for org.freedesktop.timedate1 with zbus"
repository = "https://github.com/pop-os/dbus-settings-bindings"
license = "MPL-2.0"
edition = "2024"
categories = ["os::unix-apis"]
keywords = ["systemd", "timedate", "zbus"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "timedate1_zbus"

[dependencies]
zbus.workspace = true

[dev-dependencies]
jiff.workspace = true
zbus.workspace = true
zbus.features = ["tokio"]

[dev-dependencies.tokio]
version = "1.54.0"
features = ["full"]
